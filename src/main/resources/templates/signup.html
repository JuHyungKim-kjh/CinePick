<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>CinePick - 회원가입</title>
</head>
<body>
<main class="d-flex align-items-center justify-content-center my-5">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 500px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold">회원가입</h3>
                <p class="text-muted small">취향에 딱 맞는 영화를 추천받아 보세요!</p>
            </div>

            <!-- 회원가입 폼 -->
            <form th:action="@{/signup}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-bold">이메일 주소</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="사용하실 이메일을 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="nickname" class="form-label small fw-bold">닉네임</label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="CinePick에서 사용할 닉네임" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-bold">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="8자리 이상 입력해주세요" required>
                </div>
                <div class="mb-4">
                    <label for="passwordConfirm" class="form-label small fw-bold">비밀번호 확인</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 한 번 더 입력해주세요" required>
                </div>

                <button type="submit" class="btn text-white w-100 fw-bold" style="background-color: var(--point-red);">
                    가입하기
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
