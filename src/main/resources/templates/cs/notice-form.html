<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${editing} ? 'CinePick - 공지사항 수정' : 'CinePick - 공지사항 작성'">CinePick - 공지사항 작성</title>
</head>
<body>
<main class="container my-5">

    <div th:replace="~{cs/tabs :: tabs(${activeTab})}"></div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">

        <h5 class="fw-bold mb-1" th:text="${editing} ? '공지사항 수정' : '공지사항 작성'">공지사항 작성</h5>
        <p class="text-muted small mb-4">
            여기 쓰는 글은 로그인하지 않은 방문자에게도 보입니다.
        </p>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

        <!-- 작성·수정 공용. 값은 form(실패로 되돌아온 입력) → notice(DB) 순으로 본다 -->
        <form th:action="${editing} ? @{/cs/admin/notices/{id}(id=${noticeId})} : @{/cs/admin/notices}"
              method="post">

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="category">말머리</label>
                    <select class="form-select" id="category" name="category">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                                th:selected="${(form != null and form.category == c)
                                            or (form == null and notice != null and notice.category == c)}">말머리</option>
                    </select>
                </div>
                <div class="col-md-8 d-flex align-items-end">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="pinned" name="pinned" value="true"
                               th:checked="${(form != null and form.pinned)
                                          or (form == null and notice != null and notice.pinned)}">
                        <label class="form-check-label small" for="pinned">
                            상단 고정 — 새 글이 올라와도 목록 맨 위에 남습니다.
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold" for="title">제목</label>
                <input type="text" class="form-control" id="title" name="title" maxlength="200"
                       th:value="${form != null ? form.title : (notice != null ? notice.title : '')}"
                       placeholder="예: 정기 서버 점검 안내">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold" for="content">내용</label>
                <textarea class="form-control" id="content" name="content" rows="12"
                          th:text="${form != null ? form.content : (notice != null ? notice.content : '')}"
                          placeholder="줄바꿈은 화면에 그대로 반영됩니다."></textarea>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a th:href="@{/cs/notices}" class="btn btn-outline-secondary rounded-pill px-4">취소</a>
                <button type="submit" class="btn btn-point rounded-pill px-4"
                        th:text="${editing} ? '수정' : '등록'">등록</button>
            </div>

        </form>

    </div>

</main>
</body>
</html>
