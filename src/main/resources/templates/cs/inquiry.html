<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>CinePick - 1:1 상담</title>
</head>
<body>
<main class="container my-5">

    <div th:replace="~{cs/tabs :: tabs(${activeTab})}"></div>

    <div class="row g-4">

        <!-- 왼쪽: 문의 작성 -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                <h5 class="fw-bold mb-1">문의하기</h5>
                <p class="text-muted small mb-4">
                    답변은 순서대로 확인해 드립니다. 급하신 일은 고객센터(02-1234-5678)로 연락 주세요.
                </p>

                <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <!-- 실패 시 컨트롤러가 form 을 그대로 돌려주므로 쓰던 내용이 남는다.
                     첫 진입(form 없음)을 대비해 ?: 로 기본값을 둔다 -->
                <form th:action="@{/cs/inquiry}" method="post">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="category">문의 유형</label>
                        <select class="form-select" id="category" name="category">
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                                    th:selected="${form != null and form.category == c}">분류</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="title">제목</label>
                        <input type="text" class="form-control" id="title" name="title" maxlength="200"
                               th:value="${form != null} ? ${form.title} : ''"
                               placeholder="어떤 점이 궁금하신가요?">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold" for="content">내용</label>
                        <textarea class="form-control" id="content" name="content" rows="8"
                                  th:text="${form != null} ? ${form.content} : ''"
                                  placeholder="상황을 자세히 적어주시면 더 정확히 안내해 드릴 수 있어요."></textarea>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-point rounded-pill px-4">
                            <i class="bi bi-send me-1"></i> 문의 남기기
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <!-- 오른쪽: 내 문의 내역 -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">내 문의 내역</h5>
                    <span class="text-muted small" th:text="'총 ' + ${#lists.size(inquiries)} + '건'">총 0건</span>
                </div>

                <div th:if="${#lists.isEmpty(inquiries)}" class="text-center text-muted py-5">
                    <i class="bi bi-chat-dots fs-1 d-block mb-3 opacity-50"></i>
                    아직 남기신 문의가 없어요.
                </div>

                <!-- 문의 하나가 아코디언 한 칸. 펼치면 내가 쓴 내용과 답변이 함께 보인다 -->
                <div th:each="inquiry : ${inquiries}" class="cs-faq-item" th:attr="data-category=all">
                    <button type="button" class="cs-faq-question">
                        <span class="cs-faq-category" th:text="${inquiry.category}">분류</span>
                        <span class="cs-faq-text" th:text="${inquiry.title}">제목</span>
                        <span class="cs-status"
                              th:classappend="${inquiry.answered} ? 'cs-status-done' : 'cs-status-wait'"
                              th:text="${inquiry.statusLabel}">답변 대기</span>
                        <i class="bi bi-chevron-down cs-faq-arrow"></i>
                    </button>
                    <div class="cs-faq-answer">
                        <div class="text-muted small mb-2" th:text="${inquiry.createdAt} + ' 접수'">접수일</div>
                        <div class="cs-content mb-3" th:text="${inquiry.content}">문의 내용</div>

                        <div th:if="${inquiry.answered}" class="cs-answer-box">
                            <div class="fw-semibold small mb-2">
                                <i class="bi bi-reply-fill text-point me-1"></i> 답변
                                <span class="text-muted fw-normal ms-1" th:text="${inquiry.answeredAt}">답변일</span>
                            </div>
                            <div class="cs-content" th:text="${inquiry.answer}">답변 내용</div>
                        </div>

                        <div th:unless="${inquiry.answered}" class="text-muted small">
                            아직 답변이 준비되지 않았어요. 확인하는 대로 이 자리에 답변이 올라옵니다.
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- FAQ 화면과 같은 접기/펴기라 스크립트를 재사용한다 -->
    <script defer th:src="@{/js/cs-faq.js}"></script>

</main>
</body>
</html>
