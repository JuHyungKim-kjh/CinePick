<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${editing} ? 'CinePick - FAQ 수정' : 'CinePick - FAQ 작성'">CinePick - FAQ 작성</title>
</head>
<body>
<main class="container my-5">

    <div th:replace="~{cs/tabs :: tabs(${activeTab})}"></div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">

        <h5 class="fw-bold mb-1" th:text="${editing} ? 'FAQ 수정' : 'FAQ 작성'">FAQ 작성</h5>
        <p class="text-muted small mb-4">
            여기 쓰는 글은 모든 방문자에게 공개됩니다. 특정 회원에게 보내는 답변은 1:1 상담에서 처리해 주세요.
        </p>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

        <!-- 작성·수정 공용. 값은 form(실패로 되돌아온 입력) → faq(DB) 순으로 본다 -->
        <form th:action="${editing} ? @{/cs/admin/faqs/{id}(id=${faqId})} : @{/cs/admin/faqs}"
              method="post">

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="category">분류</label>
                    <select class="form-select" id="category" name="category">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                                th:selected="${(form != null and form.category == c)
                                            or (form == null and faq != null and faq.category == c)}">분류</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="sortOrder">노출 순서</label>
                    <input type="number" class="form-control" id="sortOrder" name="sortOrder" min="0"
                           th:value="${form != null ? form.sortOrder : (faq != null ? faq.sortOrder : 0)}">
                    <!-- 운영자가 정한 순서로 보여주는 게시판이라 반드시 받는 값 -->
                    <div class="form-text">같은 분류 안에서 작을수록 위에 놓입니다.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold" for="question">질문</label>
                <input type="text" class="form-control" id="question" name="question" maxlength="200"
                       th:value="${form != null ? form.question : (faq != null ? faq.question : '')}"
                       placeholder="예: 예매를 취소하고 싶어요.">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold" for="answer">답변</label>
                <textarea class="form-control" id="answer" name="answer" rows="10"
                          th:text="${form != null ? form.answer : (faq != null ? faq.answer : '')}"
                          placeholder="줄바꿈은 화면에 그대로 반영됩니다."></textarea>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a th:href="@{/cs/faqs}" class="btn btn-outline-secondary rounded-pill px-4">취소</a>
                <button type="submit" class="btn btn-point rounded-pill px-4"
                        th:text="${editing} ? '수정' : '등록'">등록</button>
            </div>

        </form>

    </div>

</main>
</body>
</html>
