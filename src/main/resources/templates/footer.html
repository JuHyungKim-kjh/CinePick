<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="bg-dark-section pt-5 pb-4 mt-5">
    <div class="container">
        <div class="row">

            <!-- 좌측: 로고 · 슬로건 · 소셜 -->
            <div class="col-lg-4 mb-5 mb-lg-0">
                <a th:href="@{/}" class="d-inline-block mb-3">
                    <img th:src="@{/images/Logo.png}" alt="CinePick Logo" height="35"
                         class="rounded-4 px-3 py-1" style="background-color: var(--bg-main);">
                </a>
                <p class="text-light opacity-75 small mb-4">
                    영화를 더 특별하게, 취향을 더 완벽하게
                </p>
                <!-- 소셜 — 운영 중인 계정이 없어 링크가 아니다 -->
                <div class="d-flex gap-3">
                    <span class="text-white opacity-50 fs-5"><i class="bi bi-instagram"></i></span>
                    <span class="text-white opacity-50 fs-5"><i class="bi bi-youtube"></i></span>
                    <span class="text-white opacity-50 fs-5"><i class="bi bi-facebook"></i></span>
                    <span class="text-white opacity-50 fs-5"><i class="bi bi-twitter-x"></i></span>
                </div>
            </div>

            <!-- 우측: 4단 메뉴 -->
            <div class="col-lg-8">
                <div class="row">

                    <!-- 서비스. 예매·평점은 회원 전용이라 비로그인 상태에서는 로그인 화면으로 간다 -->
                    <div class="col-6 col-md-2 mb-4 mb-md-0">
                        <h6 class="text-white fw-bold mb-3">서비스</h6>
                        <ul class="list-unstyled small">
                            <li class="mb-2"><a th:href="@{/movies}" class="text-light opacity-75 text-decoration-none hover-opacity">영화</a></li>
                            <li class="mb-2"><a th:href="@{/recommendations}" class="text-light opacity-75 text-decoration-none hover-opacity">AI 큐레이션</a></li>
                            <li class="mb-2"><a th:href="@{/members/reservations}" class="text-light opacity-75 text-decoration-none hover-opacity">예매 내역</a></li>
                            <li class="mb-2"><a th:href="@{/members/ratings}" class="text-light opacity-75 text-decoration-none hover-opacity">평점</a></li>
                        </ul>
                    </div>

                    <!-- 고객지원 -->
                    <div class="col-6 col-md-2 mb-4 mb-md-0">
                        <h6 class="text-white fw-bold mb-3">고객지원</h6>
                        <ul class="list-unstyled small">
                            <li class="mb-2"><a th:href="@{/cs/notices}" class="text-light opacity-75 text-decoration-none hover-opacity">공지사항</a></li>
                            <li class="mb-2"><a th:href="@{/cs/faqs}" class="text-light opacity-75 text-decoration-none hover-opacity">FAQ</a></li>
                            <li class="mb-2"><a th:href="@{/cs/inquiry}" class="text-light opacity-75 text-decoration-none hover-opacity">1:1 문의</a></li>
                        </ul>
                    </div>

                    <!-- 회사정보 -->
                    <div class="col-6 col-md-3 mb-4 mb-md-0">
                        <h6 class="text-white fw-bold mb-3">회사정보</h6>
                        <!-- 포트폴리오라 실제 법인이 없어 링크가 아닌 글자로 둔다
                             (빈 앵커는 눌러도 아무 일이 없으면서 고장난 링크처럼 보인다) -->
                        <ul class="list-unstyled small">
                            <li class="mb-2 text-light opacity-75">회사소개</li>
                            <li class="mb-2 text-light opacity-75">이용약관</li>
                            <li class="mb-2 text-light opacity-75">개인정보처리방침</li>
                            <li class="mb-2 text-light opacity-75">위치기반서비스 이용약관</li>
                        </ul>
                    </div>

                    <!-- 고객센터 -->
                    <div class="col-12 col-md-5">
                        <h6 class="text-white fw-bold mb-3">고객센터</h6>
                        <ul class="list-unstyled small">
                            <li class="mb-2 text-light opacity-75">
                                <i class="bi bi-telephone me-2"></i>02-1234-5678
                            </li>
                            <li class="mb-2 text-light opacity-75">
                                <i class="bi bi-envelope me-2"></i>support@cinepick.co.kr
                            </li>
                            <li class="mt-3 text-light opacity-50" style="font-size: 0.75rem;">
                                평일 09:00 - 18:00 (점심 12:00 - 13:00)
                            </li>
                        </ul>
                    </div>

                </div>
            </div>

        </div>

        <!-- 카피라이트 -->
        <div class="border-top border-secondary mt-4 pt-4 text-center text-light opacity-50" style="font-size: 0.8rem;">
            &copy; 2024 CinePick. All rights reserved.
        </div>

    </div>
</footer>
</body>
</html>
