<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>CinePick - 영화 목록</title>
</head>
<body>
<main class="container my-5">

    <!-- 페이지 헤더 & 검색바 -->
    <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
        <div>
            <h3 class="fw-bold mb-1">전체 영화</h3>
            <p class="text-muted small mb-0">CinePick의 다양한 영화들을 만나보세요.</p>
        </div>

        <!-- 검색 폼 -->
        <form class="d-flex" th:action="@{/movies}" method="get" style="width: 300px;">
            <div class="input-group">
                <input type="text" class="form-control bg-light border-0" name="keyword" th:value="${param.keyword}" placeholder="영화 제목 검색">
                <button class="btn text-white px-3" style="background-color: var(--point-red);" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
    </div>

    <!-- 필터 버튼 -->
    <div class="d-flex gap-2 mb-4">
        <a th:href="@{/movies(keyword=${param.keyword}, sort='latest')}"
           class="btn rounded-pill px-3 fw-bold small"
           th:classappend="${currentSort == 'latest'} ? 'btn-dark' : 'btn-light text-muted border hover-opacity'">최신개봉순</a>

        <a th:href="@{/movies(keyword=${param.keyword}, sort='alpha')}"
           class="btn rounded-pill px-3 fw-bold small"
           th:classappend="${currentSort == 'alpha'} ? 'btn-dark' : 'btn-light text-muted border hover-opacity'">가나다순</a>
    </div>

    <!-- 영화 리스트 그리드 -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4 mb-5">

        <!-- 목록이 비었을 때 -->
        <div th:if="${#lists.isEmpty(movies)}" class="col-12 text-center py-5">
            <p class="text-muted">검색된 영화가 없습니다.</p>
        </div>

        <div class="col" th:each="movie : ${movies}">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px; overflow: hidden;">

                <!-- 상세 페이지 링크 (경로 변수에 movieCd 매핑) -->
                <a th:href="@{/movies/detail/{id}(id=${movie.movieCd})}" class="text-decoration-none text-dark">

                    <!-- 이미지가 깨지면 기본 회색 이미지로 교체 -->
                    <img th:src="${movie.posterUrl}"
                         onerror="this.src='https://via.placeholder.com/400x570?text=No+Poster'"
                         class="card-img-top hover-opacity" alt="포스터" style="height: 350px; object-fit: cover;">

                    <div class="card-body p-3">
                        <h6 class="fw-bold text-truncate mb-1" th:text="${movie.title}">영화 제목</h6>

                        <p class="small text-muted mb-2" th:text="${movie.genre + ' · ' + movie.openDate}">장르 · 개봉일</p>

                        <div class="d-flex align-items-center small fw-bold">

                            <span class="text-muted text-truncate" th:text="'감독: ' + ${movie.director}">감독: 정보없음</span>
                        </div>
                    </div>
                </a>

            </div>
        </div>

    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${startPage == 1} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/movies(keyword=${param.keyword}, page=${startPage - 1}, sort=${currentSort})}">이전</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(startPage, endPage)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link border-0 fw-bold"
                   th:style="${currentPage == i} ? 'background-color: var(--point-red); color: white;' : 'color: var(--text-dark);'"
                   th:text="${i}"
                   th:href="@{/movies(keyword=${param.keyword}, page=${i}, sort=${currentSort})}">1</a>
            </li>

            <li class="page-item" th:classappend="${endPage == totalPages} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/movies(keyword=${param.keyword}, page=${endPage + 1}, sort=${currentSort})}">다음</a>
            </li>

        </ul>
    </nav>

</main>
</body>
</html>
