<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark-section py-3 shadow-sm">
    <div class="container">

        <!-- 로고 -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/images/Logo.png}" alt="CinePick Logo" height="35"
                 class="d-inline-block align-text-top rounded-4 px-3 py-1"
                 style="background-color: var(--bg-main);">
        </a>

        <!-- 모바일 햄버거 토글 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 중앙 메뉴 -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto navbar-menu">
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold hover-opacity" th:href="@{/movies}">영화</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold hover-opacity" th:href="@{/recommendations}">AI 큐레이션</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold hover-opacity" th:href="@{/cs}">고객지원</a>
                </li>
            </ul>

            <!-- 우측 사용자 메뉴 -->
            <div class="d-flex gap-3 align-items-center mt-3 mt-lg-0">

                <!-- 비로그인 -->
                <th:block sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn text-white px-4 fw-bold" style="background-color: var(--point-red); border-radius: 20px;">
                        로그인
                    </a>
                    <a th:href="@{/signup}" class="btn btn-outline-light px-4 fw-bold" style="border-radius: 20px;">
                        회원가입
                    </a>
                </th:block>

                <!-- 로그인 -->
                <th:block sec:authorize="isAuthenticated()">
                    <a th:href="@{/members/me}" class="btn text-white px-4 fw-bold" style="background-color: var(--point-red); border-radius: 20px;">
                        <i class="bi bi-person-fill me-1"></i> 마이페이지
                    </a>
                    <a th:href="@{/logout}" class="btn btn-outline-light px-4 fw-bold" style="border-radius: 20px;">
                        <i class="bi bi-box-arrow-right me-1"></i> 로그아웃
                    </a>
                </th:block>

            </div>

        </div>
    </div>
</nav>
</body>
</html>
