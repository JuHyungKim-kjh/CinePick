<!DOCTYPE html>
<!--
  사용자 쪽 오류(404 · 403 …).

  공통 레이아웃을 그대로 쓴다 — 서버는 멀쩡하고 사용자에게 필요한 건 '빠져나갈 길'이다.
  상단 메뉴와 footer 가 있어야 막다른 길이 되지 않는다.
  (서버가 이상한 5xx 는 정반대로 layout 을 쓰지 않는다. error/5xx.html 참조)

  status 가 없을 수도 있다 — 이 템플릿을 직접 렌더하는 경로가 생기면 그렇다. 그때는 404 로 본다.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="'CinePick - ' + (${status} != null ? ${status} : 404)">CinePick - 404</title>
</head>
<body>
<main class="container my-5"
      th:with="code=${status != null ? status : 404},
               isMovie=${path != null and #strings.startsWith(path, '/movies/detail')}">

    <div class="error-card">
        <div th:replace="~{error/film-strip :: missing}"></div>

        <!-- 상태 코드는 작게. 사용자가 알아야 할 정보가 아니라 개발자용이다 -->
        <div class="error-code" th:text="${isMovie and code == 404} ? 'MOVIE NOT FOUND' : 'ERROR ' + ${code}">ERROR 404</div>

        <!-- 문구는 사과하지 않고 무슨 일인지와 다음에 뭘 할지만 말한다 -->
        <th:block th:if="${code == 403}">
            <h1 class="error-title">들어갈 수 있는 권한이 없어요</h1>
            <p class="error-desc">운영자만 볼 수 있는 화면이에요.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-point rounded-pill px-4 fw-bold">홈으로 가기</a>
                <a th:href="@{/cs}" class="btn btn-light border rounded-pill px-4 fw-bold">고객지원</a>
            </div>
        </th:block>

        <!-- 없는 영화. 예전에는 이 경우가 500 으로 나갔다 (GlobalExceptionAdvice 가 404 로 내린다) -->
        <th:block th:if="${code != 403 and isMovie}">
            <h1 class="error-title">이 영화 정보를 찾을 수 없어요</h1>
            <p class="error-desc">종영했거나 아직 등록되지 않은 작품이에요.</p>
            <div class="error-actions">
                <a th:href="@{/movies}" class="btn btn-point rounded-pill px-4 fw-bold">영화 목록 보기</a>
                <a th:href="@{/}" class="btn btn-light border rounded-pill px-4 fw-bold">홈으로</a>
            </div>
        </th:block>

        <th:block th:if="${code != 403 and !isMovie}">
            <h1 class="error-title">찾으시는 페이지가 없어요</h1>
            <p class="error-desc">주소가 바뀌었거나 삭제된 페이지예요.<br>아래에서 다시 찾아보세요.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-point rounded-pill px-4 fw-bold">홈으로 가기</a>
                <a th:href="@{/movies}" class="btn btn-light border rounded-pill px-4 fw-bold">영화 목록 보기</a>
            </div>
        </th:block>

        <p class="error-help">
            계속 같은 문제가 생기나요? <a th:href="@{/cs/inquiry}">1:1 문의하기 &rsaquo;</a>
        </p>
    </div>

</main>
</body>
</html>
